
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<div id="app">
    {{ message }}
</div>


<script>
  var test1= Vue.createApp({
    data() {
      return {
        message: 'Hello, Vue!'
      }
    },
    // Vue 객체가 관리할 요소들이 만들어지기 전
    beforeCreate() {
      console.log('beforeCreate');
      console.log(this.message);
    },
    // Vue 객체가 관리할 요소들이 만들어진 후
    created() {
      console.log('created');
      console.log(this.message);
    },
    // Vue 객체가 관리할 HTML 태그객체가 할당되기 전
    beforeMount() {
      console.log('beforeMount');
      console.log(this.message);
    },
    // Vue 객체가 관리할 HTML 태그객체가 할당된 후
    mounted() {
      console.log('mounted');
      console.log(this.message);
    },
    // Vue 객체가 관리하고 있는 HTML 태그객체가 변경되기 전
    beforeUpdate() {
      console.log('beforeUpdate');
      console.log(this.message);
    },
    // Vue 객체가 관리하고 있는 HTML 태그객체가 변경된 후
    updated() {
      console.log('updated');
      console.log(this.message);
    },
  }).mount('#app');
    


</script>
